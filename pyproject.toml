[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "torchinfra"
version = "0.1.0"
description = "ROCm/RDNA4 FP8 kernels and mini inference stack"
requires-python = ">=3.14,<3.15"
dependencies = [
    "rocm[libraries,devel,device-gfx1201]>=10.2.0",
    "torch>=2.15.0",
    "triton>=3.9.0",
    # gfx1201 kpack + gfx12-family AOTriton SDPA images
    "amd-torch-device-gfx1201>=2.15.0",
    "amd-torch-device-gfx12-0>=2.15.0",
    "flydsl>=0.4.1",
    "safetensors>=0.8.0",
    "numpy>=2.5.3",
]

[project.optional-dependencies]
dev = ["pytest>=9.2.0"]

[tool.uv.workspace]
members = ["applications/qwen21dit", "applications/nemotron-serving"]

[[tool.uv.index]]
name = "rocm"
url = "https://stable.repo.amd.com/rocm/core/whl-next/"

[[tool.uv.index]]
name = "rocm-pytorch"
url = "https://stable.repo.amd.com/rocm/pytorch/whl-next/"
explicit = true

[tool.uv.sources]
rocm = { index = "rocm" }
torch = { index = "rocm-pytorch" }
triton = { index = "rocm-pytorch" }
amd-torch-device-gfx1201 = { index = "rocm-pytorch" }
amd-torch-device-gfx12-0 = { index = "rocm-pytorch" }

[tool.hatch.build.targets.wheel]
packages = ["torchinfra", "flydsl_kernels"]
