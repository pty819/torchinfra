[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qwen21dit"
version = "0.1.0"
license = "GPL-3.0-or-later"
description = "Qwen-Image-2.1 inference application on torchinfra"
requires-python = ">=3.14,<3.15"
dependencies = [
    "torchinfra",
    "torch>=2.15.0",
    "triton>=3.9.0",
    "transformers>=5.12.1",
    "diffusers>=0.43.0",
    "safetensors>=0.8.0",
    "pillow>=12.3.0",
    "numpy>=2.5.3",
]

[project.optional-dependencies]
web = ["gradio>=6.32.0"]
dev = ["pytest>=9.2.0"]

[project.scripts]
qwen21dit-serve = "qwen21dit.serve:main"
qwen21dit-web = "qwen21dit.web:main"

[tool.uv.sources]
torchinfra = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/qwen21dit"]
