[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qwen21dit"
version = "0.1.0"
description = "Qwen-Image-2.1 inference application on torchinfra"
requires-python = ">=3.14,<3.15"
dependencies = [
    "torchinfra",
    "torch",
    "triton",
    "transformers>=5.12,<5.13",
    "diffusers>=0.43,<0.44",
    "safetensors>=0.8,<0.9",
    "pillow>=12,<13",
    "numpy>=2,<3",
]

[project.optional-dependencies]
web = ["gradio>=6.32,<6.33"]
dev = ["pytest>=8"]

[project.scripts]
qwen21dit-serve = "qwen21dit.serve:main"
qwen21dit-web = "qwen21dit.web:main"

[tool.uv.sources]
torchinfra = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/qwen21dit"]
