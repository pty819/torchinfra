[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nemotron-serving"
version = "0.1.0"
license = "GPL-3.0-or-later"
description = "Nemotron/Jina rerank HTTP serving on torchinfra"
requires-python = ">=3.14,<3.15"
dependencies = [
    "torchinfra",
    "torch>=2.15.0",
    "transformers>=5.12.1",
    "safetensors>=0.8.0",
    "numpy>=2.5.3",
]

[project.optional-dependencies]
dev = ["pytest>=9.2.0"]

[project.scripts]
nemotron-serving = "nemotron_serving.server:main"

[tool.uv.sources]
torchinfra = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/nemotron_serving"]
