[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nemotron-serving"
version = "0.1.0"
description = "Nemotron/Jina rerank HTTP serving on torchinfra"
requires-python = ">=3.14,<3.15"
dependencies = [
    "torchinfra",
    "torch",
    "transformers>=5.12,<5.13",
    "safetensors>=0.8,<0.9",
    "numpy>=2,<3",
]

[project.scripts]
nemotron-serving = "nemotron_serving.server:main"

[tool.uv.sources]
torchinfra = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/nemotron_serving"]
